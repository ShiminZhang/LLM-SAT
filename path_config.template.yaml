# Copy this to path_config.yaml and fill in your paths.
# base_solver: absolute path to the base solver directory (see setup_solver.sh)
# python_activate: path to your Python virtualenv activate script
# baseline_par2: PAR2 score of the unmodified base solver on your cluster
#                Run: python scripts/evaluate_baseline.py && python scripts/evaluate_baseline.py --collect
#                Then enter the PAR2 value printed. Used to normalize scores across clusters.
# experience_pool_data_root: where the memory bank (FAISS + records) lives; the
#                convention is src/experience_pool/data/<target_function> and
#                scripts/configure_target.py rewrites it on target switch.

base_solver: "/CHANGE_ME/solvers/base"
python_activate: "~/general/bin/activate"
baseline_par2: null  # Set after running baseline evaluation
experience_pool_data_root: "src/experience_pool/data/CHANGE_ME_target_function"

# Model roles (all optional; verified-available names in docs/model_probe_2026-08-14.md).
# default_model is the fallback for any unset role.
default_model: "gemini-3.1-pro-preview"
# generation_model: algorithm/mutation generation (default: default_model)
# coder_model: C code generation; "gemini-3.6-flash" is the cheaper coding-
#              focused option (default: default_model)
# analysis_model: memory-bank causal analysis (default: gemini-3.5-flash-lite)
